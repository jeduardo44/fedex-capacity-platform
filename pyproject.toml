[project]
name = "fedex-capacity-platform"
version = "0.1.0"
description = "Local capacity & demand analytics platform: DuckDB + dbt + forecasting + Quarto dashboards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pandas>=2.2",
    "polars>=1.9",
    "plotly>=5.24",
    "prophet>=1.1.6",
    "statsforecast>=1.7",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "loguru>=0.7",
    "gspread>=6.1",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    # Quarto jupyter engine (the quarto CLI itself is installed via Homebrew)
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
